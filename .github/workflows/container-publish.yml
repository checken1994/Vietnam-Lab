name: SCP Container CI and Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Required for Sigstore Cosign keyless signing
      attestations: write # Required for actions/attest-build-provenance (SUP-01)
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify supply-chain lock, base image digest, and OSV vulnerabilities (DEP-01 / DEP-06)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_dependencies.py

      - name: Build container image
        shell: bash
        run: |
          set -euo pipefail
          # --target runtime: without it docker builds the Dockerfile's LAST
          # stage `audit`, which is LOCAL-ONLY (dev deps, tests, .git history)
          # and must never be pushed to GHCR. Since E-W1 (23/10) that stage also
          # COPYs .git/packed-refs, absent in a CI checkout => every build since
          # failed (run 41101178247). The 19/10 green run pushed the audit stage.
          docker build --pull \
            --target runtime \
            --build-arg SCP_GIT_SHA="$GITHUB_SHA" \
            --tag scp-api:ci .
          test "$(docker run --rm --entrypoint id scp-api:ci -u)" = "10001"
          # Fail closed if repo history, the test-integrity tree or dashboard
          # node_modules leak into the publishable image, or the entrypoint is
          # not the server (the audit stage resets ENTRYPOINT to []).
          docker run --rm --entrypoint sh scp-api:ci -c 'test ! -e /app/.git && test ! -e /app/tests/T00_integrity && test ! -e /app/dashboard/node_modules'
          test "$(docker inspect --format='{{json .Config.Entrypoint}}' scp-api:ci)" = '["python","-m","scp"]'

      - name: Scan container image for OS and library vulnerabilities with Trivy (AUD-01 Area 2)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scp-api:ci
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: '.trivyignore'

      - name: Generate Ephemeral Smoke Secrets (SEC-02 / R14-N01)
        shell: bash
        run: |
          set -euo pipefail
          gen_sec() {
            openssl rand -hex 16 2>/dev/null || python3 -c "import secrets; print(secrets.token_hex(16))"
          }
          echo "SMOKE_CAPABILITY_SECRET=$(gen_sec)" >> "$GITHUB_ENV"
          echo "SMOKE_JOURNAL_SECRET=$(gen_sec)" >> "$GITHUB_ENV"
          echo "SMOKE_AUTH_TOKEN_SECRET=$(gen_sec)" >> "$GITHUB_ENV"
          echo "SMOKE_JWT_SECRET=$(gen_sec)" >> "$GITHUB_ENV"
          echo "SMOKE_ADMIN_KEY=$(gen_sec)" >> "$GITHUB_ENV"
          echo "SMOKE_PC_CONTROLLER_TOKEN=$(gen_sec)" >> "$GITHUB_ENV"

      - name: Smoke-test container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name scp-api-smoke \
            --publish 127.0.0.1:18000:8000 \
            --env SCP_HOST=0.0.0.0 \
            --env SCP_PORT=8000 \
            --env SCP_PRODUCTION_MODE=0 \
            --env SCP_EGRESS_MODE=deny \
            --env SCP_SKIP_STARTUP_GATE=0 \
            --env SCP_CAPABILITY_SECRET="${{ env.SMOKE_CAPABILITY_SECRET }}" \
            --env SCP_JOURNAL_SECRET="${{ env.SMOKE_JOURNAL_SECRET }}" \
            --env SCP_AUTH_TOKEN_SECRET="${{ env.SMOKE_AUTH_TOKEN_SECRET }}" \
            --env SCP_JWT_SECRET="${{ env.SMOKE_JWT_SECRET }}" \
            --env SCP_ADMIN_KEY="${{ env.SMOKE_ADMIN_KEY }}" \
            --env SCP_PC_CONTROLLER_TOKEN="${{ env.SMOKE_PC_CONTROLLER_TOKEN }}" \
            --env PYTHONUTF8=1 \
            scp-api:ci

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18000/health; then
              echo
              echo "Container /health smoke test passed."
              exit 0
            fi
            state="$(docker inspect --format='{{.State.Status}}' scp-api-smoke 2>/dev/null || true)"
            if [ "$state" = "exited" ]; then
              echo "Container exited before /health became available."
              docker logs scp-api-smoke || true
              exit 1
            fi
            sleep 2
          done
          echo "Timed out waiting for /health."
          docker logs scp-api-smoke || true
          exit 1

      - name: Remove smoke-test container
        if: always()
        shell: bash
        run: docker rm --force scp-api-smoke 2>/dev/null || true

      - name: Install Sigstore Cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Publish and sign image on GitHub Container Registry
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          sha_tag="$image:sha-${GITHUB_SHA:0:12}"

          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

          push_and_sign() {
            local push_log="/tmp/ghcr_push.log"
            if docker push "$1" 2>&1 | tee "$push_log"; then
              return 0
            fi
            if grep -q "permission_denied: write_package" "$push_log"; then
              echo "::notice::GHCR write_package permission not granted to GITHUB_TOKEN in account package settings; signing built image digest blob with Sigstore Cosign OIDC."
              docker inspect --format='{{.Id}}' scp-api:ci > /tmp/scp-image-id.txt
              cosign sign-blob --yes /tmp/scp-image-id.txt --bundle /tmp/scp-image-id.cosign.bundle
              echo "::notice::Signing SBOM predicate blob with Sigstore Cosign OIDC (SUP-01 fallback)..."
              cosign sign-blob --yes docs/sbom.json --bundle /tmp/scp-sbom.cosign.bundle || true
              return 1
            fi
            exit 1
          }

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            # Moving edge tag tracks the tested main branch; SHA tag is immutable by convention.
            docker tag scp-api:ci "$image:edge"
            docker tag scp-api:ci "$sha_tag"
            if push_and_sign "$image:edge"; then
              docker push "$sha_tag"
              echo "Signing published container images with Sigstore Cosign..."
              cosign sign --yes "$sha_tag"
              cosign sign --yes "$image:edge"
              echo "Attesting SBOM with Sigstore Cosign (SUP-01)..."
              cosign attest --yes --type cyclonedx --predicate docs/sbom.json "$sha_tag" || echo "::warning::Cosign SBOM attestation skipped or failed due to OIDC/registry permission"
            fi
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME,,}"
            docker tag scp-api:ci "$image:$version"
            docker tag scp-api:ci "$image:latest"
            docker tag scp-api:ci "$sha_tag"
            if push_and_sign "$image:$version"; then
              docker push "$image:latest"
              docker push "$sha_tag"
              echo "Signing published container images with Sigstore Cosign..."
              cosign sign --yes "$sha_tag"
              cosign sign --yes "$image:$version"
              cosign sign --yes "$image:latest"
              echo "Attesting SBOM with Sigstore Cosign (SUP-01)..."
              cosign attest --yes --type cyclonedx --predicate docs/sbom.json "$sha_tag" || echo "::warning::Cosign SBOM attestation skipped or failed due to OIDC/registry permission"
            fi
          else
            echo "No publication tags configured for ref: $GITHUB_REF"
          fi

      - name: Attest Build Provenance (SLSA Build Level 3 - SUP-01)
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        continue-on-error: true
        with:
          subject-path: 'docs/sbom.json'
