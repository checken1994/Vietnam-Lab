name: SCP L3 Verification (T00 Meta-Audit)

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 0' # Weekly Sunday full-tree scheduled audit

permissions:
  contents: read

env:
  SCP_PRODUCTION_MODE: '0'
  SCP_SKIP_STARTUP_GATE: '0'
  SCP_EGRESS_MODE: deny
  PYTHONUTF8: '1'

jobs:
  t00-meta-audit:
    name: "L3: T00 Meta-Audit & Guardrails"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Required for diff checking against origin/main
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Generate Ephemeral CI Secrets (SEC-02 / B66)
        shell: bash
        run: |
          JWT_SEC=$(openssl rand -hex 16 2>/dev/null || python -c "import secrets; print(secrets.token_hex(16))")
          ADMIN_KEY=$(openssl rand -hex 16 2>/dev/null || python -c "import secrets; print(secrets.token_hex(16))")
          CAP_SEC=$(openssl rand -hex 16 2>/dev/null || python -c "import secrets; print(secrets.token_hex(16))")
          echo "SCP_JWT_SECRET=$JWT_SEC" >> "$GITHUB_ENV"
          echo "SCP_ADMIN_KEY=$ADMIN_KEY" >> "$GITHUB_ENV"
          echo "SCP_CAPABILITY_SECRET=$CAP_SEC" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pip install -r scp/requirements-dev.txt
      - name: Run T00 Meta-Audit Tripwire
        run: python tools/t00_meta_audit.py
      - name: Secret Scanner — Regex scan for hardcoded secrets in commits/PRs (SEC-02)
        run: python tools/scan_secrets.py
      - name: Secret Scanner — Full-tree scan for production source package (SEC-02 / R5-N03)
        run: python tools/scan_secrets.py --path scp
      - name: Secret Scanner — Full-tree scan for repository (SEC-02 / R5-N03)
        run: python tools/scan_secrets.py --all
      - name: Gitleaks Secret Scanner Action (SEC-02 / SEC-10)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Supply-Chain Dependency & Hash/SBOM Audit (DEP-01)
        run: python tools/audit_dependencies.py
      - name: Coverage Thresholds & Configuration Verification (TST-03)
        run: python tools/check_coverage_thresholds.py --verify-config
      - name: Real Code Coverage Threshold Enforcement (TST-03)
        run: python tools/check_coverage_thresholds.py
      - name: Test Inventory / Collection Integrity
        # This confirms tests are collectable without syntax/import errors, 
        # but does NOT claim to generate exact-SHA verified evidence.
        run: |
          echo "Collecting test inventory..."
          pytest tests/ tests/internal/ --collect-only
      - name: Core Gate Test Suite Execution (M-01 Fail-Closed PR Gate)
        run: |
          pytest tests/T00_integrity/ tests/T02_contract/ tests/T03_capability/ tests/T04_kernel/ tests/T10_recovery/ -v --maxfail=5
