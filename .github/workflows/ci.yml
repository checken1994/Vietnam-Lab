name: SCP CI Baseline (non-blocking)

on: [push, pull_request]

permissions:
  contents: read

env:
  # [H-01 fix 2026-10-01] The RC-2 no-hardcoded-token scan
  # (tests/internal/external_audit/test_security.py) fail-closed skips when
  # this env is unset — it had silently skipped on EVERY CI run. This is a
  # CI-only scan ORACLE, not a real secret: the scanner greps product source
  # for this exact string, and the value appears in no .py file. CI runners
  # are ephemeral and the value grants nothing outside the run.
  SCP_AUTH_TOKEN_SECRET: "ci-only-runtime-placeholder"
  SCP_PRODUCTION_MODE: '0'
  SCP_SKIP_STARTUP_GATE: '0'
  SCP_EGRESS_MODE: deny
  PYTHONUTF8: '1'

jobs:
  p0-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Generate Ephemeral CI Secrets (SEC-02)
        shell: bash
        run: |
          JWT_SEC=$(openssl rand -hex 16 2>/dev/null || python -c "import secrets; print(secrets.token_hex(16))")
          ADMIN_KEY=$(openssl rand -hex 16 2>/dev/null || python -c "import secrets; print(secrets.token_hex(16))")
          CAP_SEC=$(openssl rand -hex 16 2>/dev/null || python -c "import secrets; print(secrets.token_hex(16))")
          JOURNAL_SEC=$(openssl rand -hex 16 2>/dev/null || python -c "import secrets; print(secrets.token_hex(16))")  # R5: K_journal is separate from the capability key
          echo "SCP_JWT_SECRET=$JWT_SEC" >> "$GITHUB_ENV"
          echo "SCP_ADMIN_KEY=$ADMIN_KEY" >> "$GITHUB_ENV"
          echo "SCP_CAPABILITY_SECRET=$CAP_SEC" >> "$GITHUB_ENV"
          echo "SCP_JOURNAL_SECRET=$JOURNAL_SEC" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          python -m pip install -r scp/requirements-dev.txt
          python -m pip check
      - name: Supply-Chain Dependency & Hash/SBOM Audit (DEP-01)
        run: python tools/audit_dependencies.py
      # The baseline suite includes node dashboard-contract tests and the live
      # cluster e2e (next dev on :3000); they need node >= 22.6 and dashboard
      # node_modules. bun is NOT installed: zero-bun eradication (d0125739)
      # asserts shutil.which("bun") is None.
      # Node 24 = Dockerfile node:24; dashboard tests run node --experimental-strip-types
      # (needs >= 22.6). Explicit pin: never rely on the runner image's default node.
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
        with:
          node-version: '24'
      - name: Verify Node 24 runtime
        shell: bash
        run: node -e "if (process.versions.node.split('.')[0] !== '24') { throw new Error(process.version) } console.log(process.version)"
      - name: Install dashboard dependencies for baseline suite
        working-directory: dashboard
        run: npm ci --ignore-scripts --no-audit
      - name: Enforce Baseline (P0)
        run: python scripts/enforce_baseline.py

      # This workflow is a fast baseline only. It must never emit release or
      # customer-handoff verdicts; scp-rc-promotion.yml is the sole authority.
