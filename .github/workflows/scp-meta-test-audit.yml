name: SCP Meta-Test Audit
on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sunday
  workflow_dispatch: # Enable emergency manual runs

permissions:
  contents: read

jobs:
  meta-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r scp/requirements-dev.txt
      - name: Run Meta-Audit (T00)
        run: pytest tests/T00_integrity/test_meta_audit.py
