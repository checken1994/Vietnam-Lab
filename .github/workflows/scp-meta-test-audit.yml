name: SCP Meta-Test Audit
on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sunday
  workflow_dispatch: # Enable emergency manual runs

permissions:
  contents: read

jobs:
  meta-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r scp/requirements-dev.txt
      - name: Run Meta-Audit (T00)
        run: pytest tests/T00_integrity/test_meta_audit.py
