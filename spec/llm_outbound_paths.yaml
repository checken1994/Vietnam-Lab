schema_version: 1

# Z0 inventory. Every production LLM egress path must be registered here.
# Statuses (Z4 audit 2026-09-02, branch 26-p0-foundation-06-14):
#                        immediately before its own network call; denial proven
#   GUARDED_GATEWAY    - path routes through the canonical gateway whose package
#                        asserted by the gateway tests, not re-proven per path
#   LEGACY_UNGUARDED   - not yet migrated; FORBIDDEN to add new calls here
paths:
  - path: scp/llm_gateway/client.py
    status: GUARDED_GATEWAY
    kind: httpx
  - path: scp/meta/multi_llm_check.py
    status: GUARDED_GATEWAY
    kind: urllib
