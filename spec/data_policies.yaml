schema_version: 1

policies:
  PUBLIC:
    raw_storage_allowed: true
    external_provider_allowed: true
    log_raw_allowed: false
    export_allowed: true
    encryption_required: false
    raw_retention_days: 30

  # INTERNAL may use an explicitly approved external provider. This preserves
  # current SCP code/reasoning workflows while SENSITIVE/SECRET remain denied.
  # Provider-specific allowlists are a later policy layer; this flag is not a
  # blanket external egress pass.
  INTERNAL:
    raw_storage_allowed: true
    external_provider_allowed: true
    log_raw_allowed: false
    export_allowed: false
    encryption_required: false
    raw_retention_days: 30

  SENSITIVE:
    raw_storage_allowed: false
    redacted_storage_allowed: true
    external_provider_allowed: false
    log_raw_allowed: false
    export_allowed: false
    encryption_required: true
    raw_retention_days: 7

  SECRET:
    raw_storage_allowed: false
    redacted_storage_allowed: true
    external_provider_allowed: false
    log_raw_allowed: false
    export_allowed: false
    encryption_required: true
    raw_retention_days: 0
