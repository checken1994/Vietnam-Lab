schema_version: '4.0'
spec_revision: 4.0.1
reference_id: complete-scp-structural-cause-effect-matrix
title: SCP Future Target Structural Cause-Effect Matrix
description: 'Đặc tả machine-readable chuẩn hóa kiến trúc đích SCP tương lai (Complete-SCP target state): 12 hệ thống lõi, 8 hệ xuyên suốt, phase P0-P4, authority boundary, dependency, cause-effect, failure/recovery semantics, evidence maturity và T00-T11. Đây là target structural specification; không phải bằng chứng rằng SCP hiện tại đã hoàn thành.'
terminology:
  complete_scp: Tên của trạng thái đích SCP khi toàn bộ kiến trúc mục tiêu được hiện thực hóa; không phải current status.
  target_scp: Đồng nghĩa vận hành với Complete-SCP target state trong file này.
  target_spec_coverage_complete: Chỉ có nghĩa inventory/obligation đã khai báo được bao phủ trong phạm vi đặc tả và validator hiện tại; không chứng minh rằng không còn missing piece.
  runtime_verified: Chỉ được suy ra từ implementation + production path + Reality evidence đúng scope/SHA.
document_role:
  type: future_target_structural_cause_effect_specification
  scope: ENTIRE_COMPLETE_SCP
  scope_semantics: WHOLE_FUTURE_TARGET_ARCHITECTURE
  normative_authority_order: [latest_direct_user_instruction, AGENTS.md, .agents/skills/scp-dna/SKILL.md, .agents/skills/scp-dna/references/dna-principles.md, spec/complete_scp_reference.yaml, spec/protected_invariants.yaml, relevant_specialized_skill, this_matrix]
  state_evidence_sources: [spec/implementation_bindings.yaml, self.capability_map, live_runtime_and_same_sha_evidence]
  conflict_domains: [Normative target requirements are not removed because current implementation is missing., State evidence may downgrade current maturity/status but may not erase a target requirement., 'A matrix capability absent from complete_scp_reference.yaml is REFERENCE_ALIGNMENT_GAP, not permission to omit it.']
  must_not_claim: [implementation_exists_without_binding_and_code, runtime_verified_without_C_or_D_evidence, release_pass_without_same_sha_mandatory_gates, current_scp_done_because_target_yaml_is_complete, no_missing_piece_remains]
completeness_semantics:
  closed_world_target_inventory: Machine validation may establish that all currently declared required systems, capabilities, edges, forbidden paths and gate obligations are internally covered.
  open_world_epistemic_limit: SCP DNA forbids claiming that no unknown missing piece exists. New Reality evidence may expand or revise the target inventory even after target-spec coverage passes.
  allowed_verdict: TARGET_SPEC_COVERAGE_COMPLETE_WITHIN_DECLARED_SCOPE
  forbidden_verdicts: [ABSOLUTELY_COMPLETE, NO_MISSING_PIECES, CURRENT_RUNTIME_COMPLETE_FROM_SPEC]
semantic_basis:
  target_scp_definition: Safe Agent Runtime / Agent OS + Epistemic System + Autonomous Knowledge and Experience Learning + Independent Evidence / Reality Verification + Self-Auditing / Self-Improving Engineering Loop + Zero-Cost Intelligence + Internet Safety / Knowledge Quality Firewall + Risk Intelligence / Early Warning + Governance / External Authority Boundary + Self-Model / Capability Awareness.
  canonical_closed_loop: [OBSERVE, QUESTION_WHY, NAME_MISSING_EVIDENCE, ACQUIRE, QUARANTINE_VALIDATE, CORROBORATE_CONTRADICT, HYPOTHESIZE, PLAN_SMALL_REVERSIBLE, POLICY_CAPABILITY_GATE, EXECUTE, OBSERVE_REAL_POST_STATE, INDEPENDENT_VERIFY, COMMIT_ROLLBACK_OR_UNKNOWN, LEARN, UPDATE_KNOWLEDGE_EXPERIENCE_SELF_MODEL, AUDIT_THE_METHOD]
  proof_chain: [EXISTS, REACHABLE, PRODUCTION_CALLER, REAL_STATE_EFFECT, OBSERVATION, INDEPENDENT_VERIFIER, FAILURE_INJECTION, RECOVERY_EVIDENCE]
global_invariants:
- {id: G01_REALITY_OVER_MODEL, rule: Reality evidence outranks model output, model confidence and consensus.}
- {id: G02_PASS_NOT_TRUE, rule: 'PASS means no observed failure inside the tested scope; PASS is not Truth.'}
- {id: G03_FAIL_CLOSED_UNKNOWN, rule: 'Missing authority/evidence yields UNKNOWN/BLOCKED, never implicit ALLOW/VERIFIED.'}
- {id: G04_EXTERNAL_DATA_UNTRUSTED, rule: 'Internet, documents, tool output and repository content are data, not higher-priority instruction.'}
- {id: G05_INDEPENDENT_LINEAGE, rule: Shared lineage and UNKNOWN_INDEPENDENCE do not count as independent support.}
- {id: G06_CONFIDENCE_ADVISORY, rule: Confidence cannot promote an epistemic verdict to VERIFIED.}
- {id: G07_REVERSIBLE_CHANGE, rule: 'System changes are bounded, observable, reversible and independently verified.'}
- {id: G08_GOVERNED_ACTION, rule: 'Reasoning, Knowledge, Forecast and Risk cannot directly call external/local side-effect tools.'}
- {id: G09_ZERO_COST_HARD_WALL, rule: 'max_cost_usd=0; unknown/stale pricing=DENY; paid_fallback=false.'}
- {id: G10_PRIVACY_BEFORE_EGRESS, rule: DataClass/privacy eligibility is checked before provider/tool/network dispatch.}
- {id: G11_NO_BLIND_RETRY, rule: Uncertain external side effects require reconciliation before any retry.}
- {id: G12_APPEND_ONLY_AUTHORITY, rule: 'Evidence, authority decisions and history are corrected by supersession, not silent rewrite.'}
- {id: G13_TEMPORAL_HISTORY, rule: Current state never destroys historical valid-time/system-time history.}
- {id: G14_CORRELATION_NOT_CAUSATION, rule: Association or precedence alone cannot become a causal claim.}
- {id: G15_FORECAST_NOT_FACT, rule: A forecast remains a prediction until independently resolved against later Reality.}
- {id: G16_SIMULATION_NOT_REALITY, rule: Simulation/Digital Twin evidence cannot be promoted to production Reality proof.}
- {id: G17_HUMAN_AUTHORITY_HIGH_CONSEQUENCE, rule: High-consequence external authority/action remains human-governed where contract requires it.}
- {id: G18_NO_MANUFACTURED_GREEN, rule: No delete/skip/xfail/threshold weakening/fail-open change may manufacture PASS.}
- {id: G19_SAME_SHA_RELEASE_EVIDENCE, rule: Mandatory verification/release evidence binds the exact tested SHA and test profile.}
- {id: G20_SELF_MODEL_EVIDENCE, rule: Capability maturity derives from evidence, not class/function existence.}
- {id: G21_LEARNING_CANNOT_WEAKEN_AUTHORITY, rule: 'Learning/AutoFix cannot weaken DNA, Evidence, Reality, security, privacy, zero-cost or release authority.'}
- {id: G22_UNKNOWN_MUST_BE_REMEMBERED, rule: 'Unresolved questions, blind spots, contradictions and missing observability remain durable.'}
- {id: G23_EXTERNAL_ROOT_OF_TRUST, rule: 'Capability-grant, protected-policy and release roots of trust remain outside normal self-modifiable authority.'}
- {id: G24_HUMAN_COMPREHENSION_REQUIRED, rule: 'High-consequence approval is invalid unless impact, evidence, scope and rollback are presented for human understanding.'}
- {id: G25_NO_CLOSED_WORLD_COMPLETENESS_CLAIM, rule: Coverage of known inventory cannot prove that no missing piece exists; target architecture remains revisable by Reality.}
- {id: G26_BOUNDED_VERIFICATION, rule: Audit/verification loops have explicit budgets/termination; exhaustion preserves UNKNOWN/BLOCKED instead of looping forever or forcing PASS.}
- {id: G27_CATASTROPHIC_FORGETTING_GUARD, rule: Learning and self-change must preserve or strengthen protected safety invariants and regression evidence.}
- {id: G28_CHANGE_AUDIT_ROLLBACK_PROVENANCE, rule: 'Every material self-change records before/after identity, Reality result and rollback provenance.'}
- {id: G29_INDEPENDENT_META_REVIEW, rule: 'Major self-audit, self-improvement and release claims require an independent reviewer/lineage appropriate to the claim.'}
dna_traceability:
  1: [semantic_basis.canonical_closed_loop.QUESTION_WHY, S08_REASONING_SYSTEM]
  2: [semantic_basis.canonical_closed_loop, DP02_ACTION, DP05_SELF_IMPROVEMENT]
  3: [S12_SELF_AWARENESS_AUDIT.self.audit_the_auditor, CE-S12-02]
  4: [G17_HUMAN_AUTHORITY_HIGH_CONSEQUENCE, G24_HUMAN_COMPREHENSION_REQUIRED, S11_GOVERNANCE]
  5: [G05_INDEPENDENT_LINEAGE, CE-S05-02, X07_MULTI_AGENT_COORDINATION]
  6: [G23_EXTERNAL_ROOT_OF_TRUST, identity.root_of_trust, CE-X01-02]
  7: [self_improvement.autofix_safety_guards, CE-S09-04]
  8: [G28_CHANGE_AUDIT_ROLLBACK_PROVENANCE, X02_OBSERVABILITY_CAUSAL_TELEMETRY.self_change_required_fields]
  9: [G07_REVERSIBLE_CHANGE, self_improvement.rollback, CE-S09-01, CE-S09-03]
  10: [X07_MULTI_AGENT_COORDINATION, CE-X07-01]
  11: [G24_HUMAN_COMPREHENSION_REQUIRED, governance.human_comprehension, CE-S11-01]
  12: [G07_REVERSIBLE_CHANGE, CE-S08-02, X06_SIMULATION_DIGITAL_TWIN]
  13: [S02_GATEWAY_RESILIENCE.intelligence.free_qualification, S02_GATEWAY_RESILIENCE.intelligence.adaptive_free_router]
  14: [G05_INDEPENDENT_LINEAGE, 'X07_MULTI_AGENT_COORDINATION.forbidden_paths.majority_vote -> truth']
  15: [G29_INDEPENDENT_META_REVIEW, self.independent_meta_review, CE-S12-03]
  16: [G10_PRIVACY_BEFORE_EGRESS, shared_architecture_contracts.capability_token_contract, governance.privacy_retention]
