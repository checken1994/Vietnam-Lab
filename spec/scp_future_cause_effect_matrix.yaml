    - {id: CE-S12-03, covers_capabilities: [self.audit_the_auditor, self.independent_meta_review, self.doubt_audit], cause: 'A major structural-completeness, self-improvement, security or release claim is proposed.', authority_path: [MetaAuditAuthority, IndependentReviewAuthority, LineageAuthority], effects: [scope_statement, independence_record, open_questions_preserved, PASS_WITHIN_SCOPE_or_BLOCKED_or_CONTRADICTED], must_not_effect: [self_certification, no_missing_piece_claim, shared_lineage_as_independent], evidence_target: C, gates: [T00, T06, T11]}
cross_cutting_systems:
  X01_IDENTITY_TRUST:
    name: Identity and Trust Fabric
    phase_focus: [P0, P2, P4]
    purpose: Give humans, agents, tools, providers, sources, sensors, artifacts and roots of trust explicit identity/provenance without turning reputation into Truth.
    capabilities:
    - {id: identity.actor_identity, target_maturity: M4, phase: P0}
    - {id: identity.source_identity, target_maturity: M4, phase: P0}
    - {id: identity.trust_dimensions, target_maturity: M4, phase: P2}
    - {id: identity.independence_basis, target_maturity: M4, phase: P0}
    - {id: identity.root_of_trust, target_maturity: M5, phase: P0}
    required_properties: [identity_confidence, provenance, scope, freshness, data_handling, independence, root_owner, rotation_history]
    forbidden_paths: ['reputation -> VERIFIED', 'same_publisher -> independent', 'internal_self_modify -> root_of_trust']
    gates: [T02, T03, T06, T11]
    cause_effect_edges:
    - {id: CE-X01-01, covers_capabilities: [identity.actor_identity, identity.source_identity, identity.trust_dimensions, identity.independence_basis], cause: A source/actor/artifact is introduced or re-identified., authority_path: [IdentityAuthority, ProvenanceAuthority], effects: [identity_record, provenance_scope_freshness_dimensions, conservative_trust_state], must_not_effect: [reputation_as_truth, identity_guess_as_VERIFIED], evidence_target: C, gates: [T02, T06]}
    - {id: CE-X01-02, covers_capabilities: [identity.root_of_trust], cause: A root-of-trust owner/key/policy or capability-grant authority is created, rotated, revoked or modified., authority_path: [ExternalRootAuthority, HumanAuthority, GovernanceAuthority], effects: [explicit_external_authorization, rotation_or_revocation_record, new_root_hash], must_not_effect: [internal_self_grant, silent_root_rewrite], evidence_target: D, gates: [T00, T03, T10, T11]}
  X02_OBSERVABILITY_CAUSAL_TELEMETRY:
    name: Observability and Causal Telemetry
    phase_focus: [P0, P1, P2, P3, P4]
    purpose: Connect decision -> action -> side effect -> observation -> evidence -> verdict with durable correlation IDs.
    capabilities:
    - {id: observability.trace_identity, target_maturity: M4, phase: P0}
    - {id: observability.audit_events, target_maturity: M4, phase: P0}
    - {id: observability.metrics, target_maturity: M4, phase: P0}
    - {id: observability.provenance_links, target_maturity: M4, phase: P0}
    required_ids: [trace_id, task_id, attempt_id, step_id, capability_id, policy_hash, tool_call_id, observation_id, verifier_id, artifact_id]
    self_change_required_fields: [change_id, before_hash, after_hash, reality_verdict, rollback_token]
    forbidden_paths: ['raw_secret -> log', 'sensitive_full_prompt -> metric_label', 'material_change -> unaudited']
    gates: [T01, T04, T06, T08, T10, T11]
    cause_effect_edges:
    - {id: CE-X02-01, covers_capabilities: [observability.trace_identity, observability.audit_events, observability.metrics, observability.provenance_links], cause: A governed decision/action/observation/verdict or material self-change occurs., authority_path: [TelemetryAuthority, EvidenceAuthority], effects: [correlated_trace, durable_audit_event, provenance_link, before_after_rollback_fields_if_self_change], must_not_effect: [secret_logging, untraceable_side_effect, unaudited_self_change], evidence_target: C, gates: [T06, T08, T11]}
  X03_RESOURCE_GOVERNOR:
    name: Resource Governor
    phase_focus: [P1, P2, P3]
    purpose: Bound CPU, RAM, disk, network, process, crawler, verification and free-provider resources while preserving safety priorities.
    capabilities:
    - {id: resource.cpu_memory_disk, target_maturity: M4, phase: P3}
    - {id: resource.network_fd_process, target_maturity: M4, phase: P3}
    - {id: resource.free_api_quota, target_maturity: M4, phase: P2}
    - {id: resource.free_llm_quota, target_maturity: M4, phase: P1}
    - {id: resource.crawler_budget, target_maturity: M4, phase: P2}
    - {id: resource.storage_budget, target_maturity: M4, phase: P3}
    - {id: resource.verification_budget, target_maturity: M4, phase: P1}
    priority_order: [safety_recovery, user_task, verification, learning, curiosity]
    forbidden_paths: ['resource_exhaustion -> disable_safety', 'quota_exhaustion -> paid_fallback', 'verification_budget_exhausted -> forced_PASS']
    gates: [T04, T05, T08, T10]
    cause_effect_edges:
    - {id: CE-X03-01, covers_capabilities: [resource.cpu_memory_disk, resource.network_fd_process, resource.free_api_quota, resource.free_llm_quota, resource.crawler_budget, resource.storage_budget], cause: A resource budget approaches or crosses its configured bound., authority_path: [ResourceGovernor, TaskKernelAuthority], effects: [throttle_pause_wait_or_block, lower_priority_work_paused_first], must_not_effect: [disable_safety, paid_fallback, unbounded_budget_growth], evidence_target: C, gates: [T04, T05, T08, T10]}
    - {id: CE-X03-02, covers_capabilities: [resource.verification_budget], cause: Audit/verification cannot converge within its bounded budget or termination criteria., authority_path: [VerificationBudgetAuthority, DoubtAuthority, MetaAuditAuthority], effects: [UNKNOWN_or_BLOCKED, open_question_preserved, resume_condition_if_known], must_not_effect: [infinite_verification_loop, forced_PASS, silent_drop_of_unknown], evidence_target: C, gates: [T00, T06, T08]}
  X04_SUPPLY_CHAIN:
    name: Supply Chain Security
    phase_focus: [P3, P4]
    purpose: Track source/version/hash/license/risk/privilege/network access for packages, models, datasets, plugins, binaries and workflows.
    capabilities:
    - {id: supply_chain.inventory, target_maturity: M4, phase: P3}
    - {id: supply_chain.hash_provenance, target_maturity: M4, phase: P3}
    - {id: supply_chain.quarantine_test_scan, target_maturity: M4, phase: P3}
    - {id: supply_chain.bounded_rollout, target_maturity: M5, phase: P4}
    update_flow: [QUARANTINE, TEST, SECURITY_SCAN, BOUNDED_ROLLOUT]
    forbidden_paths: ['new_dependency -> immediate_production_trust']
    gates: [T01, T03, T07, T10, T11]
    cause_effect_edges:
    - {id: CE-X04-01, covers_capabilities: [supply_chain.inventory, supply_chain.hash_provenance, supply_chain.quarantine_test_scan, supply_chain.bounded_rollout], cause: A new package/model/dataset/plugin/binary/workflow version is proposed., authority_path: [SupplyChainAuthority, Quarantine, SecurityScan, GovernanceAuthority], effects: [inventory_record, hash_license_risk_record, bounded_rollout_if_allowed], must_not_effect: [immediate_production_trust], evidence_target: C, gates: [T03, T07, T11]}
  X05_DISASTER_RECOVERY:
    name: Disaster Recovery
    phase_focus: [P0, P3, P4]
    purpose: Preserve evidence and authority state, prevent duplicate side effects, migrate/rebuild safely and reconcile before resume.
    capabilities:
    - {id: recovery.crash_power_loss, target_maturity: M5, phase: P0}
    - {id: recovery.corrupt_journal, target_maturity: M5, phase: P3}
    - {id: recovery.partial_write, target_maturity: M5, phase: P0}
    - {id: recovery.provider_db_network_outage, target_maturity: M5, phase: P3}
    - {id: recovery.disk_full, target_maturity: M5, phase: P3}
    - {id: recovery.index_rebuild, target_maturity: M5, phase: P3}
    - {id: recovery.post_action_unknown, target_maturity: M5, phase: P0}
    - {id: recovery.schema_migration, target_maturity: M5, phase: P3}
    recovery_order: [preserve_evidence, prevent_duplicate_side_effects, restore_authority_state, validate_or_migrate_schema, rebuild_projection, reconcile, resume_known_safe]
    forbidden_paths: [cache_backup_as_authority, 'unknown_external_outcome -> blind_retry', 'migration_failure -> recreate_empty_authority_store']
    gates: [T01, T04, T10, T11]
    cause_effect_edges:
    - {id: CE-X05-01, covers_capabilities: [recovery.crash_power_loss, recovery.corrupt_journal, recovery.partial_write, recovery.provider_db_network_outage, recovery.disk_full, recovery.index_rebuild, recovery.post_action_unknown], cause: Crash/power loss/corruption/outage interrupts authority state., authority_path: [RecoveryAuthority, EvidenceAuthority, TaskKernelAuthority], effects: [preserve_evidence, prevent_duplicate_side_effect, restore_or_rebuild_authority_state, reconcile, safe_resume_or_BLOCKED], must_not_effect: [cache_as_authority, blind_retry], evidence_target: D, gates: [T01, T04, T10]}
    - {id: CE-X05-02, covers_capabilities: [recovery.schema_migration], cause: Authority storage schema/version/checksum changes or becomes incompatible., authority_path: [MigrationAuthority, RecoveryAuthority, EvidenceAuthority], effects: [validate_migration, preserve_history, reversible_migration_or_BLOCKED, post_migration_integrity_check], must_not_effect: [silent_schema_rewrite, delete_and_recreate_on_failure], evidence_target: D, gates: [T01, T02, T10, T11]}
  X06_SIMULATION_DIGITAL_TWIN:
    name: Simulation and Digital Twin
    phase_focus: [P3]
    purpose: Test patch, policy, recovery, incident and resource scenarios without confusing simulation with production Reality.
    capabilities:
    - {id: simulation.policy, target_maturity: M4, phase: P3}
    - {id: simulation.patch, target_maturity: M4, phase: P3}
    - {id: simulation.recovery, target_maturity: M4, phase: P3}
    - {id: simulation.incident, target_maturity: M4, phase: P3}
    - {id: simulation.resource, target_maturity: M4, phase: P3}
    forbidden_paths: ['simulation_PASS -> production_VERIFIED', 'low_fidelity_twin -> high_consequence_authority']
    gates: [T02, T07, T09, T10]
    cause_effect_edges:
    - {id: CE-X06-01, covers_capabilities: [simulation.policy, simulation.patch, simulation.recovery, simulation.incident, simulation.resource], cause: A risky policy/patch/recovery/incident/resource scenario is evaluated in simulation., authority_path: [SimulationAuthority, GovernanceAuthority], effects: [simulation_evidence, limitations_and_fidelity_record], must_not_effect: [production_VERIFIED, automatic_high_consequence_action], evidence_target: B, gates: [T07, T09]}
  X07_MULTI_AGENT_COORDINATION:
    name: Multi-Agent Coordination
    phase_focus: [P3]
    purpose: Coordinate Planner/Researcher/Critic/Verifier/Risk/Policy/Recovery agents with bounded ownership, turns and authority.
    capabilities:
    - {id: coordination.roles, target_maturity: M4, phase: P3}
    - {id: coordination.shared_state, target_maturity: M5, phase: P3}
    - {id: coordination.bounded_turns, target_maturity: M4, phase: P3}
    - {id: coordination.disagreement, target_maturity: M4, phase: P3}
    - {id: coordination.no_circular_approval, target_maturity: M4, phase: P3}
    forbidden_paths: ['agent -> self_grant_capability', 'planner -> self_verify', 'majority_vote -> truth', 'hidden_undocumented_memory -> authority_state']
    gates: [T03, T04, T06, T08, T09, T10]
    cause_effect_edges:
    - {id: CE-X07-01, covers_capabilities: [coordination.roles, coordination.shared_state, coordination.bounded_turns, coordination.disagreement, coordination.no_circular_approval], cause: Multiple agents collaborate or disagree on one task., authority_path: [CoordinationAuthority, TaskKernelAuthority, GovernanceAuthority, IndependentVerifier], effects: [bounded_role_assignments, shared_durable_state, disagreement_record, independent_resolution_if_needed], must_not_effect: [circular_approval, self_granted_capability, majority_vote_as_truth], evidence_target: C, gates: [T03, T06, T09, T10]}
  X08_WORLD_STATE_TEMPORAL_MODEL:
    name: World-State and Temporal Model
    phase_focus: [P2]
    purpose: Represent OBSERVED/INFERRED/PREDICTED world state with bitemporal history and reconstructable projections.
    capabilities:
    - {id: world.entity_identity, target_maturity: M4, phase: P2}
    - {id: world.event_model, target_maturity: M4, phase: P2}
    - {id: world.temporal_state, target_maturity: M5, phase: P2}
    - {id: world.change_detection, target_maturity: M4, phase: P2}
    - {id: world.state_projection, target_maturity: M5, phase: P2}
    state_kinds: [OBSERVED, INFERRED, PREDICTED]
    forbidden_paths: ['prediction -> observation', 'current_state -> overwrite_history', 'same_name -> entity_merge']
    gates: [T01, T02, T06, T08, T09, T10]
    cause_effect_edges:
    - {id: CE-X08-01, covers_capabilities: [world.entity_identity, world.event_model, world.temporal_state, world.change_detection, world.state_projection], cause: A new world observation changes or conflicts with prior state., authority_path: [EvidenceAuthority, EntityEventAuthority, TemporalAuthority, WorldStateProjection], effects: [append_temporal_assertion, preserve_valid_and_system_time, reconstructable_history, change_record], must_not_effect: [overwrite_history, prediction_as_observation, same_name_entity_merge], evidence_target: C, gates: [T02, T06, T09, T10]}
shared_architecture_contracts:
  authority_storage: {rule: Durable authority stores are canonical; vector index/cache/projection are accelerators and rebuildable.}
  common_event_envelope: {required_fields: [schema_version, event_id, event_type, timestamp, trace_id, task_id, attempt_id, actor, subject_refs, policy_hash, payload, evidence_refs, data_class, integrity.content_hash]}
  capability_token_contract: {required_fields: [capability_id, task_id, attempt_id, tool_scope, resource_scope, operation, max_data_class, side_effect_class, expiry, max_uses, approval_id_if_required, revocation_epoch, policy_hash]}
  data_classes: [PUBLIC, INTERNAL, SENSITIVE, SECRET]
  epistemic_verdicts: [VERIFIED, CONTRADICTED, INSUFFICIENT, UNKNOWN]
  evidence_levels: {A: STATIC, B: INTEGRATION, C: REAL_END_TO_END, D: C_PLUS_RECOVERY}
  external_action_risk: {A0: read_only_no_side_effect, A1: local_reversible_write, A2: external_write_submit_upload, A3: credential_destructive_privilege_production_financial_or_high_consequence}
system_dependency_graph:
  canonical_paths:
  - {id: DP01_EPISTEMIC, path: [ExternalData, InternetSafety, Evidence, SourceIdentity, Lineage, Claim, EpistemicAssessment, Knowledge]}
  - {id: DP02_ACTION, path: [Knowledge, Reasoning, ActionProposal, Governance, Capability, TaskKernel, Tool, Reality, Evidence]}
  - {id: DP03_LEARNING, path: [AnomalyOrQuestion, WHY, MissingPiece, Hypothesis, Experiment, Reality, Evidence, PromotionOrDemotion, Lesson, Calibration, SelfModel]}
  - {id: DP04_WORLD, path: [WorldSource, Acquisition, InternetSafety, Evidence, EntityEvent, BitemporalWorldState, Change, CausalForecastRisk, Governance]}
  - {id: DP05_SELF_IMPROVEMENT, path: [Finding, Validation, AutofixSafetyGuards, BoundedPatch, DriftGuard, Snapshot, TaskKernel, Reality, ProtectedRegression, CommitOrRollback, Lesson, ReAudit]}
  - {id: DP06_HIGH_CONSEQUENCE, path: [RiskAssessment, EvidenceBundle, HumanComprehension, ExplicitAuthority, ScopedCapability, ExternalConnector, PostSubmitRealityVerification]}
  - {id: DP07_ROOT_AUTHORITY, path: [RootChangeRequest, IndependentGovernanceReview, HumanAuthority, RootRotationOrRevocation, AuditEvidence]}
  forbidden_edges: ['ExternalData -> Knowledge', 'ExternalData -> Action', 'ModelSelfReport -> Reality', 'Confidence -> VERIFIED', 'Knowledge -> Tool', 'ExperimentResult -> VERIFIED', 'Forecast -> Fact', 'Correlation -> CAUSES', 'RiskAuthority -> Tool', 'Simulation -> ProductionReality', 'Agent -> SelfGrantCapability', 'UnknownExternalOutcome -> BlindRetry', 'PaidModel -> ZeroCostProductionPath', 'RawSecret -> ModelPrompt', 'RawSecret -> Log', 'InternalSelfModification -> RootOfTrust', 'KnownInventoryCoverage -> NoMissingPieceClaim']
test_architecture:
  T00:
    dir: tests/T00_integrity
    name: Test Integrity and Meta-Audit
    obligations: [detect placeholder/assert-true/unconditional skip/xfail, detect invented API or broken production binding, detect fake C/D evidence labels, detect orphan capability and orphan cause-effect edge, prove every required capability is covered by one-or-more cause-effect edges, prove every cause-effect edge maps to one-or-more T00-T11 gates, detect capability/reference alignment gap without deleting future requirement, detect weakened protected invariants and root-of-trust self-modification, reject closed-world no-missing-piece claims, 'classify HARNESS_BROKEN / PRODUCT_BLOCKED / PRODUCT_FAIL / STRUCTURAL_COVERAGE_GAP / PASS_WITHIN_SCOPE']
  T01: {dir: tests/T01_boot, name: Boot and Reproducibility, obligations: [clean boot/start/stop, schema/migration/integrity fail-closed, config/manifest/lock reproducibility, unclean-shutdown recovery classification]}
  T02: {dir: tests/T02_contract, name: Semantic and Contract, obligations: [IDs/schema/state transitions, ontology and authority contracts, entity/event/bitemporal semantics, common event envelope, capability token contract]}
  T03: {dir: tests/T03_capability, name: 'Trust, Capability and Internet Safety', obligations: [deny-by-default capability and PEP, SSRF/egress/path/secret/privacy/sandbox, prompt-injection quarantine, human comprehension and external authority, root-of-trust cannot be self-granted, risk cannot bypass governance]}
  T04: {dir: tests/T04_kernel, name: Kernel and Durable State, obligations: [journal/projection/lease/fencing/checkpoint/idempotency, kill switch, reconciliation state, bounded monitor/task/mission lifecycle]}
  T05: {dir: tests/T05_gateway, name: Gateway and Resilience, obligations: [quota/circuit breaker/backoff/retry-after, privacy before provider]}
  T06: {dir: tests/T06_verifier, name: Evidence and Reality, obligations: [real observation and provenance, lineage independence, stale/self-report rejection, contradiction preservation, forecast resolution by later Reality, same-SHA/profile binding where applicable, independent meta-review lineage where required]}
  T07: {dir: tests/T07_learning, name: 'Learning, Knowledge and AutoFix', obligations: [quarantine/poisoning/lineage quality, promotion/demotion/revalidation, OpenQuestion/MissingPiece/Hypothesis/Experiment, Lesson begins unverified, autofix rate-limit/timeout/cooldown/audit/snapshot/blast-radius guards, catastrophic-forgetting protected regression guard, re-audit the fixer]}
  T08: {dir: tests/T08_runtime, name: Runtime Closed Loop and Soak, obligations: [real read-understand-plan-act-observe-verify path, bounded resource and verification profiles, projection determinism, long-running mission lifecycle and termination]}
  T09:
    dir: tests/T09_golden_task
    name: Golden End-to-End
    required_scenarios_for_target_scp:
    - {id: GOLDEN_A_AGENT_OS, minimum_level: C}
    - {id: GOLDEN_B_SELF_IMPROVEMENT, minimum_level: C}
    - {id: GOLDEN_C_WORLD_INTELLIGENCE, minimum_level: C}
    - {id: GOLDEN_D_AUTONOMOUS_COORDINATION, minimum_level: C}
    - {id: GOLDEN_E_EXTERNAL_AUTHORITY_CONTINUITY, minimum_level: C}
    rule: Future Golden scenarios remain target requirements even before their phase is implemented.
  T10: {dir: tests/T10_recovery, name: D-Level Recovery and Chaos, obligations: [hard-kill/restart/timeout, post-side-effect uncertainty, resume/rollback/reconcile/BLOCKED/UNKNOWN semantics, no duplicate external side effects, authority/projection recovery, schema migration failure and rollback]}
  T11: {dir: tests/T11_release, name: Release and Handoff, obligations: [tested SHA, Complete SCP reference hash/version, matrix hash/revision, DNA hash, required Skill hashes, test profile/config/runtime/manifest hashes, 'mandatory blockers=0', fresh post-main-handoff verification when release semantics require it]}
phase_coverage_map:
  P0: {must_establish: [S01_EXECUTION_OS.foundation, S05_EVIDENCE_SYSTEM, S06_KNOWLEDGE_SYSTEM.foundation, S11_GOVERNANCE.foundation_and_secret_boundary, S12_SELF_AWARENESS_AUDIT.foundation, S04_INTERNET_SAFETY.foundation, X01_IDENTITY_TRUST.foundation_and_root_of_trust, X02_OBSERVABILITY_CAUSAL_TELEMETRY.foundation, X05_DISASTER_RECOVERY.foundation]}
  P1: {must_establish: [S06_KNOWLEDGE_SYSTEM.promotion_revalidation, S07_EXPERIENCE_SYSTEM, S08_REASONING_SYSTEM, S09_SELF_IMPROVEMENT.with_autofix_guards_and_forgetting_guard, S12_SELF_AWARENESS_AUDIT.doubt_blindspots, X03_RESOURCE_GOVERNOR.verification_budget]}
  P2: {must_establish: [S03_INTERNET_ACQUISITION, S04_INTERNET_SAFETY.full_ingress, S10_RISK_INTELLIGENCE.world_intelligence, X08_WORLD_STATE_TEMPORAL_MODEL, X03_RESOURCE_GOVERNOR.minimum_world_budget]}
  P3: {must_establish: [X03_RESOURCE_GOVERNOR.full, X06_SIMULATION_DIGITAL_TWIN, X07_MULTI_AGENT_COORDINATION, S01_EXECUTION_OS.long_running_mission, S10_RISK_INTELLIGENCE.incident_command, S12_SELF_AWARENESS_AUDIT.audit_the_auditor_and_independent_review, X05_DISASTER_RECOVERY.schema_migration]}
  P4: {must_establish: [S11_GOVERNANCE.external_authority, S10_RISK_INTELLIGENCE.external_alert, X04_SUPPLY_CHAIN.full, X05_DISASTER_RECOVERY.full_continuity, S01_EXECUTION_OS.high_consequence_boundary]}
open_questions_required:
- {id: OQ01, question: "Khi nào storage authority phải vượt SQLite/equivalent và migration authority thay đổi ra sao?"}
- {id: OQ02, question: "Lineage resolver deterministic có thể đạt đến mức nào trước khi cần semantic assistance?"}
- {id: OQ03, question: "Làm sao qualification model miễn phí tránh benchmark overfit và stale capability?"}
- {id: OQ04, question: "Revalidation cadence tối ưu theo từng domain/volatility là gì?"}
- {id: OQ05, question: "External authority connectors nào thực sự được ủy quyền và ở phạm vi nào?"}
- {id: OQ06, question: "Privacy/retention theo jurisdiction nào và policy nào được ưu tiên khi xung đột?"}
- {id: OQ07, question: "Digital Twin cần fidelity nào trước khi dùng cho từng loại action/risk?"}
- {id: OQ08, question: "Hai independent verifier bất đồng thì resolution authority nào được dùng?"}
- {id: OQ09, question: "Causal inference verified-free nào đủ tốt theo từng task class?"}
- {id: OQ10, question: "Knowledge graph partition/rebuild authority vận hành thế nào khi scale?"}
- {id: OQ11, question: "Information-gain scheduler chống source bias và feedback loop thế nào?"}
- {id: OQ12, question: "Phát hiện long-term poisoning và giả independent lineage bằng cách nào?"}
- {id: OQ13, question: "Quota phân bổ user task, verification, learning và curiosity thế nào?"}
- {id: OQ14, question: "Self-fix test infrastructure được phép tự sửa đến đâu để tránh Goodhart?"}
- {id: OQ15, question: 'Root-of-trust/authority nào vĩnh viễn human-owned hoặc non-self-modifiable, và rotation/recovery policy cụ thể là gì?'}
coverage_contract:
  required: {core_systems: 12, cross_cutting_systems: 8, capabilities: 120, cause_effect_edges: 51, test_gates: 12, phases: 5, global_invariants: 29}
  every_core_system_must_have: [name, purpose, phase_focus, authority_owners, capabilities, depends_on, forbidden_paths, cause_effect_edges]
  every_cross_cutting_system_must_have: [name, purpose, phase_focus, capabilities, forbidden_paths, gates, cause_effect_edges]
  every_capability_must_have: [id, target_maturity, phase]
  every_cause_effect_edge_must_have: [id, covers_capabilities, cause, authority_path, effects, must_not_effect, evidence_target, gates]
  traceability_rules: [Every required capability appears in at least one cause_effect_edge.covers_capabilities., Every cause-effect edge maps to one-or-more applicable T00-T11 gates., Every covered capability ID must exist exactly once in the structural inventory., Every maturity target must have a compatible evidence floor., Reference alignment and implementation maturity are separate from target inventory membership.]
  fail_if: [required_core_system_missing, required_cross_cutting_system_missing, required_phase_missing, required_test_gate_missing, required_global_invariant_missing, duplicate_capability_id, orphan_capability_without_owner, capability_not_covered_by_any_edge, edge_covers_unknown_capability, cause_effect_without_test_gate, cause_effect_without_evidence_target, authority_path_bypasses_governance_when_side_effectful, epistemic_path_bypasses_evidence, recovery_semantics_missing_for_side_effectful_or_durable_capability, future_required_capability_omitted_because_not_yet_implemented, reference_alignment_gap_silently_deletes_target_requirement, zero_cost_invariant_weakened, secret_boundary_weakened, root_of_trust_becomes_normal_self_modifiable_state, catastrophic_forgetting_guard_removed, verification_loop_unbounded_or_forces_pass, external_alert_human_authority_weakened, same_sha_release_binding_removed, known_inventory_coverage_claimed_as_no_missing_piece]
  completion_rule: TARGET_SPEC_COVERAGE_COMPLETE_WITHIN_DECLARED_SCOPE may be emitted only when the validator finds zero declared-inventory coverage gaps, zero orphan capabilities, zero uncovered cause-effect obligations, zero forbidden dependency violations and zero mandatory T00-T11 mapping gaps. It never means no unknown missing piece exists.
  implementation_status_rule: Implementation status is not hard-coded as architectural truth; missing implementation never removes a target capability.
structural_coverage_summary:
  core_systems_required: 12
  core_systems_declared: 12
  cross_cutting_required: 8
  cross_cutting_declared: 8
  capabilities_required: 120
  capabilities_declared: 120
  cause_effect_edges_required: 51
  cause_effect_edges_declared: 51
  phases_required: 5
  phases_declared: 5
  gates_required: 12
  gates_declared: 12
  global_invariants_required: 29
  global_invariants_declared: 29
  declared_structural_scope: ENTIRE_COMPLETE_SCP
  target_spec_verdict: TARGET_SPEC_COVERAGE_COMPLETE_BY_DECLARATION_PENDING_MACHINE_VALIDATION
  epistemic_completeness_verdict: UNPROVABLE_BY_DESIGN_OPEN_TO_NEW_MISSING_PIECES
  runtime_verdict: NOT_DERIVED_FROM_THIS_FILE
release_interpretation:
  this_file_can_prove_if_machine_validated: [Declared future target SCP structural inventory is internally represented., Every declared capability has cause-effect coverage and gate traceability., Future capabilities remain visible even when reference alignment or implementation is missing.]
  this_file_cannot_prove: [current capability implementation exists, current capability maturity, runtime correctness, release readiness, no missing pieces remain, Current SCP DONE]
  scoped_phase_verdict_templates:
    P0: 26-P0 Foundation verified within P0 scope on evidence snapshot SHA X.
    P1: 26-P1 Cognitive Control Plane verified within P1 scope on evidence snapshot SHA X.
    P2: 26-P2 World Intelligence Plane verified within P2 scope on evidence snapshot SHA X.
    P3: 26-P3 Autonomous Coordination Plane verified within P3 scope on evidence snapshot SHA X.
    P4: 26-P4 External Operation and Continuity Plane verified within P4 scope on evidence snapshot SHA X.
