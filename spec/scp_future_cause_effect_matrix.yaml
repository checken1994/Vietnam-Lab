  27: [G04_EXTERNAL_DATA_UNTRUSTED, S04_INTERNET_SAFETY, internet.raw_quarantine]
  28: [G27_CATASTROPHIC_FORGETTING_GUARD, self_improvement.catastrophic_forgetting_guard, CE-S09-05]
  29: [G29_INDEPENDENT_META_REVIEW, X07_MULTI_AGENT_COORDINATION, CE-X07-01]
maturity_model:
  M0: IDEA
  M1: SPECIFIED
  M2: STATIC_PRESENT
  M3: INTEGRATED
  M4: C_RUNTIME_VERIFIED
  M5: D_RECOVERY_VERIFIED
  M6: RELEASE_GATED
  evidence_floor_by_maturity: {M0: null, M1: A, M2: A, M3: B, M4: C, M5: D, M6: D_PLUS_RELEASE}
  rule: No maturity jump may be inferred from lower-level evidence.
phase_model:
  rule: Phase controls implementation order, not membership in the future target architecture.
  phases:
    P0: {name: FOUNDATION_AUTHORITY, purpose: 'Evidence, lineage, ontology, calibration, self-model, governance, privacy, zero-cost and durable execution foundations.'}
    P1: {name: COGNITIVE_CONTROL, purpose: 'Promotion, doubt, contradiction, revalidation, hypotheses, experiments, lessons, benchmark and cognitive orchestration.'}
    P2: {name: WORLD_INTELLIGENCE, purpose: 'Safe acquisition, entity/event identity, bitemporal world state, change, geo, causality, forecasting, risk and early warning.'}
    P3: {name: AUTONOMOUS_COORDINATION, purpose: 'Resource planning, simulation, bounded multi-agent coordination, incident command and long-running missions.'}
    P4: {name: EXTERNAL_OPERATION_CONTINUITY, purpose: 'Authorized external connectors, high-consequence boundaries, human command, continuity and disaster recovery at full-system scope.'}
structural_inventory:
  required_core_systems: 12
  required_cross_cutting_systems: 8
  required_capabilities: 120
  required_cause_effect_edges: 51
  required_test_gates: 12
  required_phases: 5
  required_global_invariants: 29
  core_system_ids: [S01_EXECUTION_OS, S02_GATEWAY_RESILIENCE, S03_INTERNET_ACQUISITION, S04_INTERNET_SAFETY, S05_EVIDENCE_SYSTEM, S06_KNOWLEDGE_SYSTEM, S07_EXPERIENCE_SYSTEM, S08_REASONING_SYSTEM, S09_SELF_IMPROVEMENT, S10_RISK_INTELLIGENCE, S11_GOVERNANCE, S12_SELF_AWARENESS_AUDIT]
  cross_cutting_ids: [X01_IDENTITY_TRUST, X02_OBSERVABILITY_CAUSAL_TELEMETRY, X03_RESOURCE_GOVERNOR, X04_SUPPLY_CHAIN, X05_DISASTER_RECOVERY, X06_SIMULATION_DIGITAL_TWIN, X07_MULTI_AGENT_COORDINATION, X08_WORLD_STATE_TEMPORAL_MODEL]
capability_defaults:
  target_required: true
  reference_alignment_status_source: validator(compare matrix capability IDs with spec/complete_scp_reference.yaml)
  implementation_status_source: self.capability_map + live implementation_bindings + same-SHA evidence
  missing_reference_semantics: REFERENCE_ALIGNMENT_GAP; target capability remains visible.
  missing_implementation_semantics: MISSING/BLOCKED; target capability remains visible.
core_systems:
  S01_EXECUTION_OS:
    name: Execution OS
    phase_focus: [P0, P3, P4]
    purpose: Turn governed intent into durable bounded action, observation, verification and artifact.
    authority_owners: [TaskKernelAuthority, CapabilityAuthority, GovernanceAuthority, RealityVerifier]
    capabilities:
    - {id: execution.task_kernel, target_maturity: M5, phase: P0}
    - {id: execution.capability_security, target_maturity: M5, phase: P0}
    - {id: execution.scheduler_supervisor, target_maturity: M5, phase: P3}
    - {id: execution.long_running_mission, target_maturity: M5, phase: P3}
    - {id: execution.hands_tools, target_maturity: M4, phase: P0}
    - {id: execution.recovery_reconciliation, target_maturity: M5, phase: P0}
    - {id: execution.kill_switch, target_maturity: M5, phase: P0}
    - {id: execution.high_consequence_boundary, target_maturity: M5, phase: P4}
    depends_on: [S11_GOVERNANCE, X02_OBSERVABILITY_CAUSAL_TELEMETRY, X03_RESOURCE_GOVERNOR, X05_DISASTER_RECOVERY]
    forbidden_paths: ['model -> direct_tool_side_effect', 'knowledge -> direct_tool_side_effect', 'unknown_external_outcome -> blind_retry', 'mission -> unbounded_runtime', 'high_consequence_action -> bypass_human_governance']
    cause_effect_edges:
    - {id: CE-S01-01, covers_capabilities: [execution.task_kernel, execution.capability_security, execution.hands_tools], cause: Governed ActionProposal is authorized with a scoped capability., authority_path: [GovernanceAuthority, CapabilityAuthority, TaskKernelAuthority, ToolDriver, RealityVerifier], effects: [durable_intent, bounded_action, post_state_observation, verification_record, commit_or_rollback], must_not_effect: [unscoped_tool_access, silent_external_write], evidence_target: C, gates: [T03, T04, T08, T09]}
    - {id: CE-S01-02, covers_capabilities: [execution.recovery_reconciliation], cause: Process crashes after possible external side effect but before durable observation., authority_path: [TaskKernelAuthority, RecoveryAuthority], effects: [RECONCILE_REQUIRED, no_blind_retry, external_post_state_check], must_not_effect: [automatic_action_replay], evidence_target: D, gates: [T04, T10]}
    - {id: CE-S01-03, covers_capabilities: [execution.scheduler_supervisor, execution.long_running_mission, execution.kill_switch], cause: 'A long-running mission starts, reaches a checkpoint, exceeds a bound, or receives stop/kill authority.', authority_path: [SchedulerSupervisor, ResourceGovernor, TaskKernelAuthority, KillSwitchAuthority], effects: [bounded_lease, checkpoint, pause_resume_or_cancel, durable_mission_state], must_not_effect: [unbounded_runtime, orphan_process, ignore_kill_switch], evidence_target: D, gates: [T04, T08, T10]}
    - {id: CE-S01-04, covers_capabilities: [execution.high_consequence_boundary, execution.capability_security, execution.hands_tools], cause: A credential/destructive/privilege/production/financial or other high-consequence action is proposed., authority_path: [GovernanceAuthority, HumanComprehension, HumanAuthority, CapabilityAuthority, TaskKernelAuthority, RealityVerifier], effects: [REQUIRE_HUMAN_or_DENY, narrow_capability_if_approved, post_action_reality_check], must_not_effect: [approval_bypasses_sandbox, model_self_authorization, broad_capability_grant], evidence_target: C, gates: [T03, T09, T11]}
  S02_GATEWAY_RESILIENCE:
    name: Zero-Cost Intelligence Fabric
    phase_focus: [P0, P1]
    purpose: Use only price-verified free intelligence while preserving quality, privacy, quota and resilience semantics.
    authority_owners: [PricingProofAuthority, ZeroCostPEP, ProviderRegistryAuthority, QuotaLedgerAuthority, AdaptiveRouter]
    capabilities:
    - {id: intelligence.gateway_resilience, target_maturity: M4, phase: P0}
    - {id: intelligence.provider_registry, target_maturity: M4, phase: P1}
    - {id: intelligence.quota_ledger, target_maturity: M4, phase: P1}
    - {id: intelligence.free_qualification, target_maturity: M4, phase: P1}
    - {id: intelligence.adaptive_free_router, target_maturity: M4, phase: P1}
    - {id: intelligence.cache_coalescing, target_maturity: M3, phase: P1}
    depends_on: [S11_GOVERNANCE, S12_SELF_AWARENESS_AUDIT, X02_OBSERVABILITY_CAUSAL_TELEMETRY, X03_RESOURCE_GOVERNOR]
    forbidden_paths: ['complexity -> paid_model', 'free_by_name -> authorization', 'unknown_price -> network_dispatch', 'free_model -> bypass_privacy']
    cause_effect_edges:
    - {id: CE-S02-01, covers_capabilities: [intelligence.gateway_resilience, intelligence.provider_registry, intelligence.free_qualification, intelligence.adaptive_free_router], cause: An LLM task requires a model., authority_path: [AdaptiveRouter, PrivacyPolicy, PricingProofAuthority, ZeroCostPEP, ProviderDriver], effects: [rank_verified_free_candidates, dispatch_only_exact_zero_price_and_eligible_candidate], must_not_effect: [paid_fallback, unknown_price_dispatch, privacy_bypass], evidence_target: C, gates: [T05, T08]}
    - {id: CE-S02-02, covers_capabilities: [intelligence.quota_ledger, intelligence.provider_registry, intelligence.adaptive_free_router, intelligence.cache_coalescing], cause: 'All qualified verified-free candidates are exhausted, rate-limited or unhealthy.', authority_path: [QuotaLedgerAuthority, ProviderRegistryAuthority, AdaptiveRouter], effects: [cache_or_coalesce_if_valid, WAITING_FREE_QUOTA_or_BLOCKED, next_eligible_time_if_known], must_not_effect: [paid_fallback, quality_requirement_weakening], evidence_target: C, gates: [T05, T10]}
  S03_INTERNET_ACQUISITION:
    name: Internet Acquisition
    phase_focus: [P2]
    purpose: Acquire external observations for explicit questions, revalidation, monitoring or evidence needs without unbounded crawling.
    authority_owners: [AcquisitionAuthority, SourceRegistryAuthority, AcquisitionScheduler]
    capabilities:
    - {id: world.acquisition, target_maturity: M4, phase: P2}
    - {id: world.source_registry, target_maturity: M4, phase: P2}
    - {id: world.discovery, target_maturity: M3, phase: P2}
    - {id: world.monitor_policy, target_maturity: M4, phase: P2}
    - {id: world.free_api_qualification, target_maturity: M4, phase: P2}
    depends_on: [S04_INTERNET_SAFETY, S05_EVIDENCE_SYSTEM, S11_GOVERNANCE, X03_RESOURCE_GOVERNOR, X08_WORLD_STATE_TEMPORAL_MODEL]
    forbidden_paths: ['crawler -> direct_knowledge', 'discovered_host -> automatic_egress_allow', 'curiosity -> unbounded_monitoring']
    cause_effect_edges:
    - {id: CE-S03-01, covers_capabilities: [world.acquisition, world.source_registry, world.discovery, world.monitor_policy], cause: User/OpenQuestion/Revalidation/RiskMonitor requests an external observation., authority_path: [AcquisitionAuthority, SourcePolicy, InternetSafety, EvidenceAuthority], effects: [bounded_fetch, source_identity, evidence_occurrence, world_observation], must_not_effect: [direct_knowledge_write, direct_action], evidence_target: C, gates: [T02, T03, T08, T09]}
    - {id: CE-S03-02, covers_capabilities: [world.free_api_qualification, world.monitor_policy], cause: 'Acquisition resource, rate budget, or free-API eligibility is exhausted/unknown.', authority_path: [AcquisitionScheduler, ResourceGovernor, FreeApiQualification], effects: [WAIT_RESOURCE_or_BLOCKED, preserve_pending_need], must_not_effect: [budget_self_increase, paid_provider_switch, unqualified_api_dispatch], evidence_target: C, gates: [T05, T08, T10]}
  S04_INTERNET_SAFETY:
    name: Internet Safety and Knowledge Quality Firewall
    phase_focus: [P0, P2]
    purpose: Keep external content untrusted, bounded, non-executable and provenance-preserving before it reaches evidence/knowledge.
    authority_owners: [URLGuard, SafeFetcher, QuarantineAuthority, ThreatScanner, PrivacyIngressAuthority, QualityFirewall]
    capabilities:
    - {id: internet.ssrf_egress_guard, target_maturity: M5, phase: P0}
    - {id: internet.raw_quarantine, target_maturity: M4, phase: P0}
    - {id: internet.prompt_injection_firewall, target_maturity: M4, phase: P2}
    - {id: internet.malware_dangerous_data_guard, target_maturity: M4, phase: P2}
    - {id: internet.secret_pii_ingress, target_maturity: M4, phase: P0}
    - {id: internet.quality_spam_dedupe, target_maturity: M4, phase: P2}
    depends_on: [S11_GOVERNANCE, S05_EVIDENCE_SYSTEM, X01_IDENTITY_TRUST, X03_RESOURCE_GOVERNOR]
    forbidden_paths: ['external_text -> system_instruction', 'raw_quarantined_content -> planner_action', 'redirect -> skip_ssrf_recheck', 'executable_archive -> auto_execute']
    cause_effect_edges:
    - {id: CE-S04-01, covers_capabilities: [internet.raw_quarantine, internet.prompt_injection_firewall, internet.malware_dangerous_data_guard, internet.secret_pii_ingress, internet.quality_spam_dedupe], cause: 'Fetched content contains prompt injection, hidden control text, exfiltration instruction, malware/dangerous payload, PII/secret, spam or duplicate material.', authority_path: [QuarantineAuthority, ThreatScanner, PrivacyIngressAuthority, QualityFirewall], effects: [remain_untrusted, threat_flags, redaction_or_safe_extraction_or_quarantine, quality_dedupe_metadata], must_not_effect: [system_prompt_override, ActionProposal_from_payload, raw_secret_to_model], evidence_target: C, gates: [T03, T07]}
    - {id: CE-S04-02, covers_capabilities: [internet.ssrf_egress_guard], cause: URL resolves or redirects to disallowed/private/link-local/metadata target., authority_path: [URLGuard, EgressPolicy], effects: [DENY, security_event], must_not_effect: [network_dispatch_to_denied_target], evidence_target: C, gates: [T03, T10]}
  S05_EVIDENCE_SYSTEM:
    name: Evidence System
    phase_focus: [P0, P1, P2]
    purpose: Preserve immutable observation occurrences, provenance, lineage, contradictions and Reality evidence.
    authority_owners: [EvidenceStore, SourceIdentityAuthority, LineageAuthority, ContradictionAuthority, RealityVerifier]
    capabilities:
    - {id: epistemic.evidence, target_maturity: M4, phase: P0}
    - {id: epistemic.source_identity, target_maturity: M4, phase: P0}
    - {id: epistemic.lineage, target_maturity: M4, phase: P0}
    - {id: epistemic.claims, target_maturity: M4, phase: P1}
    - {id: epistemic.contradiction, target_maturity: M4, phase: P1}
    - {id: epistemic.reality_verification, target_maturity: M5, phase: P0}
    depends_on: [X01_IDENTITY_TRUST, X02_OBSERVABILITY_CAUSAL_TELEMETRY, S11_GOVERNANCE]
    forbidden_paths: ['model_response -> truth', 'source_count -> independent_support', evidence_update_in_place, 'stale_evidence -> current_state_proof']
    cause_effect_edges:
    - {id: CE-S05-01, covers_capabilities: [epistemic.evidence], cause: The same content is observed twice at different times., authority_path: [EvidenceStore], effects: [two_evidence_occurrences, shared_content_hash_allowed, distinct_observed_at], must_not_effect: [occurrence_deduplication], evidence_target: C, gates: [T02, T06]}
    - {id: CE-S05-02, covers_capabilities: [epistemic.source_identity, epistemic.lineage, epistemic.claims], cause: Multiple reports/claims share one upstream lineage., authority_path: [SourceIdentityAuthority, LineageAuthority], effects: [report_count_may_increase, independent_support_collapsed_to_conservative_lower_bound], must_not_effect: [manufactured_corroboration], evidence_target: C, gates: [T06, T07, T09]}
    - {id: CE-S05-03, covers_capabilities: [epistemic.contradiction, epistemic.reality_verification, epistemic.claims], cause: Reality evidence contradicts a model/knowledge claim., authority_path: [RealityVerifier, ContradictionAuthority], effects: [CONTRADICTED_or_UNDER_REVIEW_path, contradiction_preserved], must_not_effect: [delete_conflicting_evidence, model_self_override], evidence_target: C, gates: [T06, T07]}
  S06_KNOWLEDGE_SYSTEM:
    name: Knowledge System
    phase_focus: [P0, P1, P2]
    purpose: Manage ontology, epistemic maturity, temporal validity, promotion/demotion and scoped reusable knowledge.
