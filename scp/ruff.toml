# Ruff configuration for SCP Viet Nam

line-length = 120
# [P3-1 FIX R16] target-version py39 → py310.
# Q14 dependency audit: code uses PEP 604 union types (str | None) on pydantic
# models. pydantic v2 evaluates type annotations via eval() — str | None
# raises TypeError on Python 3.9 (PEP 604 requires 3.10+). Setting target to
# py39 misled ruff into not flagging these, and misled operators into thinking
# 3.9 was supported. py310 reflects the actual minimum.
target-version = "py310"

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear (includes B006: mutable default args, B902: blind except)
    # [R19-FIX-1] CI Gate for silent except (DNA #9 No harm).
    # [A4 AUDIT 2026-09-12 — TRUNG THỰC] 3 rules bên dưới bị select rồi ignore
    # ngay ở `ignore` phía dưới → HIỆN CHƯA enforce (dead rules). Comment cũ
    # "CI flags NEW silent except" là SAI: ruff ignore toàn cục, không có
    # semantics "new-only". CI hiện chỉ gate narrow `--select E9,F`
    # (scp-refactor-freeze.yml) + focused file list (scp-release-gate.yml).
    # Debt KHÔNG ghi cứng tại đây (số liệu mục đinh theo commit — đo lại bằng):
    #   python -m ruff check scp/ --select S110,S112,BLE001 --statistics
    # (snapshot 2026-09-26: BLE001=998, S110=3, S112=1 → tổng 1002 @ b04528d4).
    # Lộ trình: bỏ 3 ignore này sau khi Track B1 (silent-except sweep) xong.
    "BLE001", # blind-except (except Exception) — should log, not pass
    "S110",   # try-except-pass — silent failure
    "S112",   # try-except-continue — silent failure
]
ignore = [
    "E402",   # Module level import not at top of file (needed for sys.path manipulation)
    "E501",   # Line too long (handled by line-length setting)
    "E701",   # Multiple statements on one line (legacy code style)
    # [R19-FIX-1] Existing silent-except debt — xem [A4 AUDIT] ở select phía trên.
    # Bỏ ignore khi Track B1 xử lý xong debt (đếm lại bằng lệnh trên).
    "BLE001", # temporarily allowed (existing silent-except debt; regenerate count with the command above)
    "S110",   # temporarily allowed (existing silent-except debt; regenerate count with the command above)
    "S112",   # temporarily allowed (existing silent-except debt; regenerate count with the command above)
]

[lint.per-file-ignores]
"__init__.py" = ["F401", "F811"]  # Allow unused imports in __init__.py
"scripts/*" = ["E402", "F401", "E701"]  # Allow in scripts (RC-1 FIX: removed E722)
"tests/*" = ["E402", "F401"]
