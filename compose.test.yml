version: "3.9"
# SCP Test Profile — chạy toàn bộ stack trong container để audit trên mọi môi trường
# Usage: docker compose -f compose.test.yml up --build --abort-on-container-exit

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      # [F-10 fix · 2026-10-23] Backend test profile phải là stage runtime thuần
      # (trước đây build nhầm stage cuối = audit: tệp image và ENTRYPOINT lệch
      # vai trò; che khuất bởi ENTRYPOINT thừa kế của runtime).
      target: runtime
      # [H-03 fix 2026-10-01] Feed a real SHA when building manually:
      #   docker compose -f compose.test.yml build \
      #     --build-arg SCP_GIT_SHA=$(git rev-parse HEAD)
      # The default 'unknown' keeps /health service_identity honest instead
      # of silently inheriting the Dockerfile ARG default.
      args:
        SCP_GIT_SHA: ${SCP_GIT_SHA:-unknown}
    ports:
      - "127.0.0.1:8080:8000"
    command: ["8000"]
    environment:
      - SCP_HOST=0.0.0.0
      - SCP_CAPABILITY_SECRET=${SCP_CAPABILITY_SECRET:-audit-test-cap-secret-32chars}
      - SCP_JOURNAL_SECRET=${SCP_JOURNAL_SECRET:-audit-test-journal-secret-32chars}
      - SCP_JWT_SECRET=${SCP_JWT_SECRET:-audit-test-secret-change-me-32chars}
      - SCP_ADMIN_KEY=${SCP_ADMIN_KEY:-audit-test-admin-key-32chars}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-test-key}
      - SCP_PRODUCTION_MODE=0
      - SCP_EGRESS_MODE=deny
      - SCP_ASK_MAX_INFLIGHT=50
      - SCP_MULTI_LLM_CROSSCHECK=1
      - SCP_DOUBT_INTERVAL_SEC=300
      - SCP_PC_CONTROLLER_TOKEN=${SCP_PC_CONTROLLER_TOKEN:-audit-test-cap-secret-32chars}
      - SCP_AUTH_TOKEN_SECRET=${SCP_AUTH_TOKEN_SECRET:-audit-test-auth-secret-32chars}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - scp_data:/app/data
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
          pids: 100

  audit:
    build:
      context: .
      dockerfile: Dockerfile
      target: audit
      # [H-03 fix 2026-10-01] Same provenance build-arg as the backend service
      # (see comment above); audit evidence must be traceable to a SHA.
      args:
        SCP_GIT_SHA: ${SCP_GIT_SHA:-unknown}
    depends_on:
      backend:
        condition: service_healthy
    command: >
      sh -c "
        echo '=== RUN FULL AUDIT ===' &&
        python scripts/run_full_audit.py &&
        echo '=== AUDIT COMPLETE ==='
      "
    profiles:
      - test
    volumes:
      - scp_data:/app/data
      - ./reports:/app/reports
    deploy:
      resources:
        limits:
          cpus: '2'
          # [F-15 fix · 2026-10-23] pids:100 đóng băng battery giữa chừng: suite
          # ~2.400 test, mỗi TestClient boot nguyên app (judge + scheduler +
          # telemetry…) sinh nhiều thread; chạm trần 100 pids ⇒ exec không nổi,
          # container đứng im ở 0% CPU (bằng chứng vòng 7 battery 2026-10-23).
          # Auditor-runner cần trần riêng, cao hơn backend profile.
          pids: 512
          memory: 2G

volumes:
  scp_data:
