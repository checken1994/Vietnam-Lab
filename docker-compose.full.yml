# ==============================================================================
# SCP Standardized 4-Container Multi-Agent Stack (Zero-Bun Architecture)
# Reference: spec_miner_docker_contracts/survey_contracts.md § 2 & § 3
# Milestones: M4 (Docker Compose Standardization & Zero-Bun Architecture)
#
# Services:
#   1. backend: Python 3.12-slim runtime with 16-Skill Middleware (Port 8000)
#   2. agent-desktop: Virtual Desktop (Xvfb :99, Openbox, noVNC :6080, Chromium CDP :9222)
#   3. loop-scheduler: Node.js 20 Autonomous Loop Scheduler (Port 3030)
#   4. dashboard: Next.js 16 Web Dashboard embedding live noVNC (Port 3000)
#   5. brain-console: Node.js 24 read-only brain projection (Port 8090)
#
# Persistence Invariants (R4):
#   - Host ./data is directly bind-mounted to /app/data and /var/lib/scp/data.
#   - SQLite WAL mode (PRAGMA journal_mode=WAL; PRAGMA busy_timeout=30000;
#     PRAGMA synchronous=NORMAL) ensures ACID durability and multi-reader
#     concurrency across host-container boundaries.
# ==============================================================================

name: scp-full

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      # [F-10 fix · 2026-10-23] Build không chỉ định target ⇒ multi-stage mặc định
      # lấy stage CUỐI (audit, chứa pytest+tests). Backend production phải là
      # stage runtime thuần.
      target: runtime
      args:
        SCP_GIT_SHA: ${SCP_GIT_SHA:-unknown}
    image: scp-backend:full
    # [F-04 fix · 2026-10-23] Bỏ user "0:0": Dockerfile đã thiết kế USER 10001 và
    # chown /app/data cho scpuser; đã kiểm chứng 10001 ghi được WAL SQLite vào
    # bind-mount ./data trên Docker Desktop này (probe _probe_user_test.sqlite3).
    command: ["8000"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # [F-E2E-1 · 2026-10-30] File này một mình ở posture production (mặc định)
      # bị guard TỪ CHỐI boot (host 0.0.0.0 + SCP_FORCE_HTTPS=0) — đúng thiết kế.
      # Đường boot production hợp lệ: thêm overlay TLS
      #   docker compose -f docker-compose.full.yml -f docker-compose.tls.yml up -d
      # (uvicorn chỉ loopback 127.0.0.1:8001, Caddy HTTPS là listener mạng duy nhất
      # trên :8000). Dev/lab không TLS: SCP_PRODUCTION_MODE=0 với file này.
      SCP_HOST: "0.0.0.0"
      SCP_PORT: 8000
      SCP_CAPABILITY_LEVEL: "FULL_PRODUCTION"
      # [SEC-FIX 2026-10-27 · F2 audit af88fd31] Trước đây map
      # ${SCP_DOCKER_PRODUCTION_MODE:-0} — biến này KHÔNG tồn tại trong .env
      # của operator (operator đặt SCP_PRODUCTION_MODE=1) ⇒ compose lặng lẽ ép
      # posture dev (production guard tắt, /docs mở) dù comment cũ hướng dẫn
      # "Trên VPS: đặt SCP_PRODUCTION_MODE=1 trong .env" — hướng dẫn đó không
      # bao giờ tới được container. Nay pass-through thẳng biến operator,
      # fail-closed: KHÔNG có .env ⇒ mặc định posture production (an toàn hơn).
      # LƯU Ý VẬN HÀNH (đã probe 2026-10-27, scp/security/production_guard.py):
      # mode=1 yêu cầu thỏa production guard — SCP_HOST loopback HOẶC
      # SCP_FORCE_HTTPS=1, SCP_EGRESS_MODE ∈ {deny, allowlist},
      # SCP_AUTH_PASSWORD >=16 ký tự phải được map vào container. Nếu không thỏa,
      # backend TỪ CHỐI khởi động LOUD (RuntimeError "Production safety guard
      # refused startup") thay vì lặng lẽ chạy posture dev như trước — đó là
      # hành vi fail-closed có chủ đích của fix này.
      SCP_PRODUCTION_MODE: ${SCP_PRODUCTION_MODE:-1}
      # [SEC-FIX 2026-10-28 · P3 compose-map] Trước đây compose không map 2 biến
      # này cho backend ⇒ giá trị operator đặt trong .env production không bao
      # giờ tới container (production guard từ chối boot vì thiếu kênh cấu
      # hình, operator phải docker-run thủ công). Giờ pass-through thẳng theo
      # .env operator. Default GIỮ default của code (api_server.py và
      # production_guard.py đều mặc định "0"/rỗng) — nhất quán triết lý
      # fail-closed của SCP_PRODUCTION_MODE:-1 ở trên: chưa cấu hình ⇒ guard
      # TỪ CHỐI boot LOUD với thông báo rõ (yêu cầu SCP_FORCE_HTTPS=1 khi host
      # không loopback; SCP_AUTH_PASSWORD ≥16 ký tự), thay vì lặng lẽ bật
      # HTTPS redirect (gãy các gọi http nội bộ dashboard→backend) hay bịa
      # mật khẩu mặc định.
      SCP_FORCE_HTTPS: ${SCP_FORCE_HTTPS:-0}
      SCP_AUTH_PASSWORD: ${SCP_AUTH_PASSWORD:-}
      SCP_EGRESS_MODE: "allowlist"
      SCP_AUTOFIX_MODE: "apply"
      SCP_EVOLUTION_ENABLED: "1"
      # Tier-3 là "logic bug" → theo .env của operator (SCP_AUTO_APPROVE_TIER3=0)
      # SCP PHẢI dừng lại chờ người duyệt. Trước đây ghi cứng "1" ⇒ container tự
      # duyệt tier-3, không ai xem (trái ý .env). Công tắc runtime vẫn còn:
      # POST /v105/autofix/tier3-auto/{0|1} (có audit log).
      SCP_AUTO_APPROVE_TIER3: ${SCP_AUTO_APPROVE_TIER3:-0}
      SCP_DATA_DIR: "/app/data"
      SCP_KERNEL_DB_PATH: "/app/data/task_kernel.sqlite3"
      AGENT_DESKTOP_URL: "http://agent-desktop:6080"
      AGENT_DESKTOP_CDP_URL: "http://agent-desktop:9223"
      SCP_CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://dashboard:3000"
      SCP_CAPABILITY_SECRET: ${SCP_CAPABILITY_SECRET:-}
      SCP_JOURNAL_SECRET: ${SCP_JOURNAL_SECRET:-}
      SCP_APPROVAL_ISSUER_PUBLIC_KEY: ${SCP_APPROVAL_ISSUER_PUBLIC_KEY:-}
      SCP_JWT_SECRET: ${SCP_JWT_SECRET:-}
      SCP_AUTH_TOKEN_SECRET: ${SCP_AUTH_TOKEN_SECRET:-}
      SCP_ADMIN_KEY: ${SCP_ADMIN_KEY:-}
      SCP_PC_CONTROLLER_TOKEN: ${SCP_PC_CONTROLLER_TOKEN:-}
      SCP_SCHEDULER_ADMIN_TOKEN: ${SCP_SCHEDULER_ADMIN_TOKEN:-}
      SCP_LLM_EGRESS_ALLOWLIST: ${SCP_LLM_EGRESS_ALLOWLIST:-openrouter.ai,api.groq.com,generativelanguage.googleapis.com,api.openai.com,api.anthropic.com,api.deepseek.com}
      SCP_EGRESS_ALLOWLIST: "${SCP_EGRESS_ALLOWLIST:-openrouter.ai,api.groq.com,en.wikipedia.org,vi.wikipedia.org},agent-desktop,backend,localhost,127.0.0.1"
      SCP_MULTI_LLM_CROSSCHECK: ${SCP_MULTI_LLM_CROSSCHECK:-0}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./data:/var/lib/scp/data
    networks:
      - scp-network
    depends_on:
      - agent-desktop
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
          pids: 100
    restart: unless-stopped

  agent-desktop:
    build:
      context: .
      dockerfile: Dockerfile.agent-desktop
    image: scp-agent-desktop:full
    command: ["tail", "-f", "/dev/null"]
    ports:
      - "127.0.0.1:6080:6080"
    environment:
      DISPLAY: ":99"
      RESOLUTION: "1920x1080x24"
      SCREEN_WIDTH: 1920
      SCREEN_HEIGHT: 1080
      SCREEN_DEPTH: 24
      NOVNC_PORT: 6080
      VNC_PORT: 5900
      CHROME_DEBUG_PORT: 9222
    networks:
      - scp-network
    tmpfs:
      - /tmp:rw,size=256m
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://127.0.0.1:6080/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1.5G
          pids: 2000
    restart: unless-stopped

  loop-scheduler:
    image: node:20-alpine
    working_dir: /workspace/mini-services/loop-scheduler
    command: ["node", "index.js"]
    ports:
      - "127.0.0.1:3030:3030"
    volumes:
      - ./mini-services/loop-scheduler:/workspace/mini-services/loop-scheduler:ro
      - ./data:/var/lib/scp/data
      - ./data:/app/data
    networks:
      - scp-network
    environment:
      PORT: 3030
      LOOP_SCHEDULER_HOST: "0.0.0.0"
      LOOP_SCHEDULER_PORT: 3030
      SCP_BACKEND_URL: "http://backend:8000"
      SCP_BASE_URL: "http://backend:8000"
      SCP_CAPABILITY_LEVEL: "FULL_PRODUCTION"
      SCP_AUTOFIX_MODE: "apply"
      SCP_AUTOFIX_DETERMINISTIC_ONLY: "0"
      SCP_AUTOFIX_WORKER_MODE: "inline"
      DATA_DIR: "/var/lib/scp/data"
      LOOP_LOG_PATH: "/var/lib/scp/data/loop_runs.jsonl"
      LOOP_STATE_PATH: "/var/lib/scp/data/scheduler-state.json"
      SCP_AUTH_TOKEN_SECRET: ${SCP_AUTH_TOKEN_SECRET:-}
      SCP_SCHEDULER_ADMIN_TOKEN: ${SCP_SCHEDULER_ADMIN_TOKEN:-}
      LOOP_INTERVAL_SEC: ${LOOP_INTERVAL_SEC:-300}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3030/healthz').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
          pids: 50
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # brain-console: Node.js 24 read-only projection of the whole SCP brain
  # (Task Kernel, event journal, every SQLite database, audit ledgers,
  #  service topology, skill pack, runtime audit verdict).
  #
  # Read-only by construction: every SQLite database is opened with
  # `readOnly: true`, the data mount is `:ro`, and the container runs with
  # cap_drop ALL + no-new-privileges.
  #
  # node:24 is required because `node:sqlite` (built-in, zero npm deps) is
  # only available unflagged from Node 23.4 onward.
  # ─────────────────────────────────────────────────────────────────────────
  brain-console:
    image: node:24-alpine
    working_dir: /workspace/mini-services/brain-console
    command: ["node", "index.js"]
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./mini-services/brain-console:/workspace/mini-services/brain-console:ro
      - ./data:/var/lib/scp/data:ro
      - ./.agents/skills:/workspace/.agents/skills:ro
    networks:
      - scp-network
    environment:
      SCP_BRAIN_CONSOLE_HOST: "0.0.0.0"
      SCP_BRAIN_CONSOLE_PORT: 8090
      SCP_DATA_DIR: "/var/lib/scp/data"
      SCP_BRAIN_SKILLS_DIR: "/workspace/.agents/skills"
      SCP_BASE_URL: "http://backend:8000"
      LOOP_SCHEDULER_URL: "http://loop-scheduler:3030"
      AGENT_DESKTOP_URL: "http://agent-desktop:6080"
      # Optional: lets the console observe protected backend surfaces
      # instead of merely seeing them refuse the request.
      SCP_BRAIN_ADMIN_TOKEN: ${SCP_ADMIN_KEY:-}
      SCP_BRAIN_POLL_MS: "5000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8090/healthz').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
          pids: 50
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
    image: scp-dashboard:full
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      # [FIX · 2026-10-22] Nhánh dev-mode của middleware CHỈ dùng cho Docker
      # local: container chạy gateway.js làm reverse-proxy nội bộ và cần chèn
      # credential của operator cho các API admin của backend. Trên VPS đặt
      # SCP_DEV_MODE=0 + SCP_DASHBOARD_PROXY_SECRET + reverse proxy Caddy chèn
      # header (x-scp-proxy-secret) — khi đó mỗi người dùng phải tự trình bày
      # credential của mình (posture "trusted proxy" trong lib/scp-service-auth.ts).
      SCP_DEV_MODE: ${SCP_DASHBOARD_DEV_MODE:-1}
      # [FIX · 2026-10-22] Container chỉ có /app/data (không có scp/ hay spec/),
      # nên route /api/scp/activity KHÔNG tự dò được SCP_ROOT (heuristic của nó
      # đòi có cả `data` và (`spec`|`scp`)) → mọi chu kỳ loop của scheduler và
      # log dịch vụ đều không hiện trên Live Activity Stream. Chỉ định thẳng
      # /app: data/ đã được bind-mount ở trên (read-only).
      SCP_ROOT: "/app"
      SCP_INTERNAL_URL: "http://backend:8000"
      SCP_API_URL: "http://backend:8000"
      SCP_BASE_URL: "http://backend:8000"
      LOOP_SCHEDULER_URL: "http://loop-scheduler:3030"
      AGENT_DESKTOP_URL: "http://agent-desktop:6080"
      NEXT_PUBLIC_NOVNC_URL: "http://localhost:6080/vnc.html"
      SCP_HEALTH_ALLOWED_HOSTS: "backend,loop-scheduler,agent-desktop"
      SCP_API_ALLOWED_HOSTS: "backend,loop-scheduler,agent-desktop"
      SCP_DASHBOARD_PROXY_SECRET: ${SCP_AUTH_TOKEN_SECRET:-}
      SCP_ADMIN_KEY: ${SCP_ADMIN_KEY:-}
      SCP_AUTH_TOKEN_SECRET: ${SCP_AUTH_TOKEN_SECRET:-}
      SCP_PC_CONTROLLER_TOKEN: ${SCP_PC_CONTROLLER_TOKEN:-}
      SCP_SCHEDULER_ADMIN_TOKEN: ${SCP_SCHEDULER_ADMIN_TOKEN:-}
    volumes:
      - ./data:/app/data:ro
    networks:
      - scp-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
          pids: 100
    restart: unless-stopped

networks:
  scp-network:
    driver: bridge
    name: scp-network
