[pytest]
pythonpath = .
testpaths = tests tests/internal
filterwarnings =
    ignore::DeprecationWarning
# [S6b security sweep · 2026-09-11] --basetemp REMOVED from addopts.
# The previous in-repo basetemp (reports/pytest-basetemp) made fixture-written
# files (e.g. scanner-recall victim.py) land inside the repository, where
# pattern-based static scans flagged them as HIGH findings. pytest's default
# tmp root is the SYSTEM temp dir (per-user, outside the repository, auto-
# numbered/rotated), which is the permanent location now. compose.test.yml
# still overrides with --basetemp=/tmp/pytest inside the container.
