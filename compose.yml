# Local reproducibility candidate for SCP API.
# Safe default: only the API starts. The optional loop profile is not started
# by `docker compose up` and must be enabled deliberately.

services:
  scp-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SCP_GIT_SHA: ${SCP_GIT_SHA:-unknown}
    image: scp-api:local
    command: ["8000"]
    env_file:
      - .env
    environment:
      SCP_AUTH_PASSWORD_FILE: ''
      SCP_HOST: 0.0.0.0
      SCP_PORT: 8000
      SCP_MODE: isolated
      # Local candidate default per this file's header. .env may carry
      # SCP_PRODUCTION_MODE=1 for native runs; compose interpolation reads
      # .env, which silently activated the production guard inside Docker and
      # demanded a TLS gateway this stack does not have. Pin local-candidate
      # mode; switch deliberately for a production compose deployment.
      SCP_PRODUCTION_MODE: "0"
      SCP_EGRESS_MODE: ${SCP_EGRESS_MODE:-deny}
      # LLM operator allowlist is deployment config (.env), not compose code:
      # the gateway passes it as extra_allowed_hosts to the generic egress gate.
      SCP_EGRESS_ALLOWLIST: ${SCP_EGRESS_ALLOWLIST:-}
      SCP_LLM_EGRESS_ALLOWLIST: ${SCP_LLM_EGRESS_ALLOWLIST:-}
      # No TLS gateway exists in this stack; FORCE_HTTPS=1 redirected every
      # request (incl. /health) to https://host:port that nothing serves.
      SCP_FORCE_HTTPS: "0"
      SCP_SKIP_STARTUP_GATE: "0"
      SCP_AUTO_APPROVE_TIER3: "0"
      SCP_DATA_DIR: /var/lib/scp/data
      SCP_PC_WORKING_DIR: /var/lib/scp
      # Converge ask-kernel adapter + hands bridge + RetryPolicy onto ONE
      # kernel DB (hands bridge uses $SCP_DATA_DIR/task_kernel.sqlite3);
      # without this the adapter defaults to /app/data/ask_task_kernel.sqlite3
      # — same volume, but a second, divergent kernel file.
      SCP_KERNEL_DB_PATH: /var/lib/scp/data/task_kernel.sqlite3
      # [S20][W1-c4] Ask lease TTL (seconds). Default 120 [W1-c4 2026-10-02:
      # 60s < real LLM path — golden probe 57.5s sat under the old TTL; q05
      # 122.4s / q11 89.4s withheld lifecycle_authority_lost]; still
      # overridable via the host env for controlled proof runs (e.g.
      # SCP_ASK_LEASE_TTL_SECONDS=5 to demonstrate the heartbeat surviving a
      # slow real provider).
      SCP_ASK_LEASE_TTL_SECONDS: ${SCP_ASK_LEASE_TTL_SECONDS:-120}
      # [S21] Hedged LLM race (owner directive: LLM chậm ~10s → bắn LLM/API
      # khác song song, ai trả trước thắng). Defaults mirror client.py:
      # ATTEMPT_TIMEOUT=10s deadline per attempt, HEDGE_MAX=90s total cap
      # (fail-closed khi quá cap), HEDGE=on kill-switch (off → tuần tự cũ).
      SCP_LLM_HEDGE: ${SCP_LLM_HEDGE:-on}
      SCP_LLM_ATTEMPT_TIMEOUT_SECONDS: ${SCP_LLM_ATTEMPT_TIMEOUT_SECONDS:-10}
      SCP_LLM_HEDGE_MAX_SECONDS: ${SCP_LLM_HEDGE_MAX_SECONDS:-90}
      # Optional provider/bridge URL. Keep credentials out of this file.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    ports:
      # Loopback-only host exposure; put a separately configured TLS gateway in
      # front if external access is ever required.
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Named volume (ext4, Docker Desktop native) — NTFS bind mount does not
      # support SQLite WAL (disk I/O error on PRAGMA journal_mode=WAL), which
      # crash-looped the container at import time (hands_routes -> TaskKernel).
      - scp-data:/var/lib/scp/data
      - scp-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # The scheduler performs POST /v105/autofix/run-audit. It is deliberately
  # opt-in and observe-only here; do not enable it for unattended mutation.
  loop-scheduler:
    profiles: ["loop"]
    image: oven/bun:1.3.4-slim
    working_dir: /workspace/mini-services/loop-scheduler
    command: ["bun", "index.ts"]
    environment:
      SCP_AUTH_PASSWORD_FILE: ''
      SCP_AUTH_TOKEN_SECRET: ${SCP_AUTH_TOKEN_SECRET:-}
      SCP_ADMIN_KEY: ${SCP_ADMIN_KEY:-}
      # [M-07 fix 2026-10-01] No default token: the host .env defines
      # SCP_SCHEDULER_ADMIN_TOKEN, so compose now fails closed when it is
      # missing/empty instead of silently booting a predictable token.
      SCP_SCHEDULER_ADMIN_TOKEN: ${SCP_SCHEDULER_ADMIN_TOKEN:?set SCP_SCHEDULER_ADMIN_TOKEN in the host .env (fail-closed, no default)}
      SCP_BASE_URL: http://scp-api:8000
      LLM_BRIDGE_URL: ${LLM_BRIDGE_URL:-http://host.docker.internal:8081}
      LOOP_SCHEDULER_PORT: 3030
      LOOP_SCHEDULER_HOST: "0.0.0.0"
      LOOP_INTERVAL_SEC: ${LOOP_INTERVAL_SEC:-300}
      SCP_AUTOFIX_MODE: observe
      SCP_AUTOFIX_DETERMINISTIC_ONLY: "1"
      SCP_AUTOFIX_WORKER_MODE: deterministic
      LOOP_LOG_PATH: /var/lib/scp/data/loop_runs.jsonl
      LOOP_STATE_PATH: /var/lib/scp/data/scheduler-state.json
    volumes:
      - ./mini-services/loop-scheduler:/workspace/mini-services/loop-scheduler:ro
      - ./data:/var/lib/scp/data
      - ./data:/app/data
    ports:
      - "127.0.0.1:3030:3030"
    depends_on:
      scp-api:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Mảnh ghép 1 & 3: SWE-bench Environment Harness & OpenAI Adapter
  swe-bench-runner:
    profiles: ["swe-bench"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SCP_AUTH_PASSWORD_FILE: ''
      SCP_BASE_URL: http://scp-api:8000
    volumes:
      - ./data:/var/lib/scp/data
      - ./data:/app/data
    depends_on:
      scp-api:
        condition: service_started

  # [C3] Sandbox Evaluator — "autofix không tự chấm bài": consume EVAL_REQUEST
  # từ Pg event bus (channel scp_eval, bảng durable scp_events — Track C2),
  # chạy pytest THẬT trên bản sao workspace trong /tmp, publish EVAL_RESULT.
  # Opt-in profile "sandbox". YÊU CẦU SCP_EVENT_BUS_DSN trỏ tới PostgreSQL có
  # schema scp_events (fail-closed: thiếu DSN -> service exit 2, không idle).
  # Ví dụ PG test local (Track C2):
  #   docker run -d --rm --name scp-pg -e POSTGRES_PASSWORD=scppg \
  #     -e POSTGRES_DB=scpkernel -p 55432:5432 postgres:16-alpine
  #   SCP_EVENT_BUS_DSN=postgresql://postgres:scppg@host.docker.internal:55432/scpkernel
  sandbox-evaluator:
    profiles: ["sandbox"]
    build:
      context: .
      dockerfile: Dockerfile.sandbox-evaluator
    image: scp-sandbox-evaluator:local
    environment:
      SCP_AUTH_PASSWORD_FILE: ''
      SCP_EVENT_BUS_ENABLED: "1"
      SCP_EVENT_BUS_DSN: ${SCP_EVENT_BUS_DSN:-}
      SCP_SANDBOX_EVALUATOR_POLL_SECONDS: ${SCP_SANDBOX_EVALUATOR_POLL_SECONDS:-5}
      SCP_SANDBOX_EVALUATOR_TIMEOUT_S: ${SCP_SANDBOX_EVALUATOR_TIMEOUT_S:-120}
      SCP_DATA_DIR: /var/lib/scp/data
    volumes:
      - scp-data:/var/lib/scp/data
    depends_on:
      scp-api:
        condition: service_started
    read_only: true
    tmpfs:
      # Workspace tạm cho pytest: /tmp rw (không cần exec — python binary nằm
      # trong image, file workspace chỉ là data đọc qua import).
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  scp-data:

